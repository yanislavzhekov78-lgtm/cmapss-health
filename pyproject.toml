[project]
name = "cmapss-health"
version = "0.1.0"
description = "Remaining-useful-life analysis of NASA C-MAPSS turbofan data"
readme = "README.md"
authors = [
    { name = "Yanislav Zhekov", email = "yanislav_zhekov@abv.bg" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[project.scripts]
cmapss-health = "cmapss_health:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
